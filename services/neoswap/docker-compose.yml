version: '3.8'

name: neoswap-v2

services:
  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for analytics (TimescaleDB compatible)
  postgres:
    image: timescale/timescaledb-postgres:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: neoswap_analytics
      POSTGRES_USER: neoswap
      POSTGRES_PASSWORD: changeme123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoswap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for high-speed operations
  redis-fast:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-fast-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NeoSwap v2 Routing Engine
  routing-engine:
    build:
      context: ./services/neoswap/routing-engine
    ports:
      - "3002:3002"
    environment:
      REDIS_URL: redis://redis-fast:6379
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      redis-fast:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NeoSwap v2 Order Matcher
  order-matcher:
    build:
      context: ./services/neoswap/order-matcher
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis-fast:6379
      ORDER_BOOK_DB_PATH: /data/orders.sqlite
      NODE_ENV: production
    volumes:
      - matcher-data:/data
    depends_on:
      redis-fast:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NeoSwap v2 Oracle Aggregator
  oracle-aggregator:
    build:
      context: ./services/neoswap/oracle-aggregator
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      REDIS_URL: redis://redis-fast:6379
      WS_PORT: "8080"
      METRICS_PORT: "8081"
    depends_on:
      redis-fast:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/metrics', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NeoSwap v2 API Gateway
  api-gateway:
    build:
      context: ./services/neoswap/api-gateway
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: redis://redis-fast:6379
      ROUTING_ENGINE_URL: http://routing-engine:3002
      ORACLE_AGGREGATOR_URL: http://oracle-aggregator:8080
    depends_on:
      routing-engine:
        condition: service_healthy
      oracle-aggregator:
        condition: service_healthy
      redis-fast:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/quote?tokenIn=0x0&tokenOut=0x1&amount=1', (r) => r.statusCode < 500 ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NeoSwap v2 Price Feed Server
  price-feed:
    build:
      context: ./services/neoswap/price-feed
    ports:
      - "8082:8081"
    environment:
      REDIS_URL: redis://redis-fast:6379
      WS_PORT: "8081"
    depends_on:
      redis-fast:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const ws = require('ws'); new ws('ws://localhost:8081', {timeout:5000}).on('open', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NeoSwap v2 Analytics API
  analytics-api:
    build:
      context: ./services/neoswap/analytics-api
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgres://neoswap:changeme123@postgres:5432/neoswap_analytics
      CACHE_TTL: "300"
      MAX_EXPORT_SIZE: "10000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - routing-engine
      - order-matcher
      - api-gateway
      - price-feed
      - analytics-api
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3006:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  redis-fast-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  matcher-data:

networks:
  default:
    name: neoswap-network
    driver: bridge
