global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'routing-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['routing-engine:3002']

  - job_name: 'order-matcher'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['order-matcher:3003']

  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:3001']

  - job_name: 'price-feed'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['price-feed:8081']

  - job_name: 'analytics-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['analytics-api:3005']
