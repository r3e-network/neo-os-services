# The two Neo rules live in config/gitleaks/neo-rules.toml — the canonical
# fragment that explorer and web mirror and gate against (their CI compares
# the rule block with that file). `path` is resolved relative to the process
# CWD, so run gitleaks from the repository root, as the CI workflow does. It
# cannot be combined with `useDefault` here (hard load error), so
# `useDefault = true` is declared once inside the fragment and still applies:
# default rules load through the chained extend (verified with gitleaks
# 8.30.1, 2026-09-01).
[extend]
path = "config/gitleaks/neo-rules.toml"

[[allowlists]]
description = "Oracle public-key route uses a fixed public-key test vector."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)apps/web/__tests__/oracle-public-key-route\.test\.ts$''']
regexes = ['''KEY_B64[[:space:]]*=''']

[[allowlists]]
description = "Network verifier fields are public on-chain contract script hashes."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)config/networks/mainnet\.json$''',
  '''(^|/)config/networks/testnet\.json$''',
]
regexes = ['''"(?:web3auth|session_key)"[[:space:]]*:''']

[[allowlists]]
description = "Golden vectors embed config/networks/*.json verbatim, including the public aa_verifiers contract script hashes allowlisted above."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)crates/neo-os-core/tests/vectors/[^/]+\.json$''']
regexes = ['''"(?:web3auth|session_key|social_recovery)"[[:space:]]*:''']

[[allowlists]]
description = "Published runtime verifier fields are public on-chain contract script hashes."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)apps/web/public/morpheus-runtime-catalog\.json$''']
regexes = ['''"aa(?:Web3Auth|SessionKey)Verifier"[[:space:]]*:''']

[[allowlists]]
description = "Network runtime lifecycle fields are public on-chain transaction hashes."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)config/networks/mainnet\.json$''',
  '''(^|/)config/networks/testnet\.json$''',
]
regexes = ['''"web3auth_verifier_(?:deploy|authorize_core)_tx"[[:space:]]*:''']

[[allowlists]]
description = "Deployment reports contain public contract and transaction hashes."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)examples/deployments/aa-neodid-oracle-integrated-baseline\.testnet\.latest\.json$''',
  '''(^|/)examples/deployments/mainnet\.json$''',
  '''(^|/)examples/deployments/testnet-cross-stack-validation\.latest\.json$''',
  '''(^|/)examples/deployments/testnet\.json$''',
]
regexes = ['''"(?:web3AuthHash|aa_web3auth_verifier_hash|aa_web3auth_verifier_deploy|aa_web3auth_paymaster_register|aa_web3auth_paymaster_execute|latest_web3auth_verifier_hash|latest_sessionkey_verifier_hash|aa_sessionkey_verifier_deploy|aa_web3auth_domain_set_record|aa_sessionkey_domain_set_record|aa_sessionkey_verifier_hash|aa_web3auth_verifier|aa_session_key_verifier)"[[:space:]]*:''']

[[allowlists]]
description = "Pinned PKCS8 value is an interoperability-only golden vector in a test file."
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)packages/shared/src/confidential-envelope\.test\.mjs$''']
regexes = ['''privateKeyPkcs8''']

[[allowlists]]
description = "Rust oracle golden plaintext is a deterministic public interoperability fixture."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)crates/morpheus-compute/src/oracle/fetch\.rs$''',
  '''(^|/)crates/morpheus-compute/src/oracle/crypto\.rs$''',
]
regexes = ['''golden-vector-1''']

[[allowlists]]
description = "Shared confidential-envelope fixture contains one deterministic public PKCS8 interoperability key."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)crates/morpheus-compute/tests/vectors/confidential-envelope-v2-client\.json$''']
regexes = ['''"private_key_pkcs8"[[:space:]]*:''']

[[allowlists]]
description = "Rust X25519 fixture and parser-key lines contain deterministic test material or JSON field names, not deployable credentials."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)crates/morpheus-core/src/confidential\.rs$''',
  '''(^|/)crates/morpheus-compute/src/oracle/crypto\.rs$''',
  '''(^|/)workers/nitro-enclave-host/tests/unit/compute_execute\.rs$''',
]
regexes = [
  '''KEY_MATERIAL_JSON''',
  '''&?\["private_key_pkcs8",[[:space:]]*"privateKeyPkcs8",[[:space:]]*"private_key"\]''',
]

[[allowlists]]
description = "Nitro X25519 values on this line are Secrets Manager identifier names, not secret values."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)workers/nitro-enclave-host/src/secrets\.rs$''']
regexes = ['''\["NITRO_X25519_SECRET_ID",[[:space:]]*"MORPHEUS_X25519_SECRET_ID"\]''']

[[allowlists]]
description = "Relayer schema key names a PCR configuration field and carries no credential value."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)workers/morpheus-relayer/src/config-schema\.js$''']
regexes = ['''key[[:space:]]*:[[:space:]]*['"]nitro\.expectedPcr0['"]''']

[[allowlists]]
description = "Nitro fallback strings are Secrets Manager identifiers, not secret values."
condition = "AND"
regexTarget = "line"
paths = [
  '''(^|/)workers/nitro-worker/src/platform/nitro-signer\.js$''',
]
regexes = ['''env\(['"]NITRO_(?:SIGNER|X25519)_SECRET_ID['"]''']

[[allowlists]]
description = "Redaction-test placeholder is not a private key at any strength: base58 decoding it fails the trailing 4-byte base58check sum, so it cannot import into a wallet or sign anything (verified offline, 2026-08-30). A regex cannot express this check, which is why the value is exempted instead of the rule weakened."
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)apps/web/__tests__/operation-logs-redaction\.test\.ts$''']
regexes = ['''private_key[[:space:]]*[:=]''']
