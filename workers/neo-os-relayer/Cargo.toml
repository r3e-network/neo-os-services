[package]
name = "neo-os-relayer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Relayer orchestration shell: scans, fulfillment, automation, feed sync, observability (T04)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "neo-os-relayer"
path = "src/main.rs"

[dependencies]
neo-os-core = { path = "../../crates/neo-os-core" }
neo-os-chain-n3 = { path = "../../crates/neo-os-chain-n3", features = ["http"] }
neo-os-chain-evm = { path = "../../crates/neo-os-chain-evm" }
neo-os-relayer-store = { path = "../../crates/neo-os-relayer-store" }
neo-os-service-runtime = { path = "../../crates/neo-os-service-runtime" }
nitro-attest = { path = "../../crates/nitro-attest" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "http2", "rustls-tls", "json"] }
axum = "0.8"
http = "1"
hex = "0.4"
sha2 = "0.10"
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
rlp = "0.5"
k256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
