# NODE COMPATIBILITY ONLY. The production Rust relayer lives in
# docker-compose.rust.yml; automation remains an explicit Rust refusal.
services:
  morpheus-feed-relayer:
    image: '${MORPHEUS_COMPAT_RELAYER_IMAGE:?pin-explicit-node-compat-relayer-image}'
    container_name: morpheus-feed-relayer
    restart: unless-stopped
    depends_on:
      nitro-worker:
        condition: service_healthy
    env_file:
      - ${MORPHEUS_LOCAL_ENV_FILE:-./morpheus.mainnet.env}
    environment:
      NODE_ENV: production
      NITRO_API_URL: http://nitro-worker:${NITRO_WORKER_PORT:-8080}
      MORPHEUS_RELAYER_MODE: feed_only
      MORPHEUS_RELAYER_STATE_FILE: /data/.morpheus-relayer-state.feed_only.${MORPHEUS_NETWORK:-mainnet}.${MORPHEUS_RELAYER_NEO_N3_START_BLOCK:-default}.json
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - morpheus-data:/data

  morpheus-request-relayer:
    image: '${MORPHEUS_COMPAT_RELAYER_IMAGE:?pin-explicit-node-compat-relayer-image}'
    container_name: morpheus-request-relayer
    restart: unless-stopped
    depends_on:
      nitro-worker:
        condition: service_healthy
    env_file:
      - ${MORPHEUS_LOCAL_ENV_FILE:-./morpheus.mainnet.env}
    environment:
      NODE_ENV: production
      NITRO_API_URL: http://nitro-worker:${NITRO_WORKER_PORT:-8080}
      MORPHEUS_RELAYER_MODE: requests_only
      MORPHEUS_RELAYER_STATE_FILE: /data/.morpheus-relayer-state.requests_only.${MORPHEUS_NETWORK:-mainnet}.${MORPHEUS_RELAYER_NEO_N3_START_BLOCK:-default}.json
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - morpheus-data:/data
