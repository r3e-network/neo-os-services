# Morpheus Oracle — PUBLIC confidential execution-runtime gateway (AA edge migration).
#
# LIVE since 2026-06-15 as /etc/nginx/conf.d/morpheus-runtime.conf (see
# AA-EDGE-MIGRATION-RUNBOOK.md "Deployment record"). Makes the AWS Nitro box a valid
# execution runtime for the Cloudflare control plane, replacing the dead Phala runtime
# + the Vercel "emergency-vercel-runtime" placeholder.
#
# TLS: the deployed origin cert is SELF-SIGNED (the meshmini.app zone runs Cloudflare
# SSL mode "Full", non-strict, which does not validate the origin cert). certbot is NOT
# required. The server also listens on :80 so Cloudflare works in either Full or
# Flexible mode; only Cloudflare-proxied traffic should reach the box.
#
# Flow:  control plane --HTTPS--> THIS nginx (TLS) --> 127.0.0.1:8787 (the host
#        socat bridge from start-nitro-signer.sh) --vsock--> the merged enclave's
#        execution-plane passthrough --in-process--> the worker handler (compute
#        in-TEE). Requests are auth-gated by the enclave (Bearer execution token).
#
# SECURITY: this server block proxies ONLY the control plane's EXECUTION_PLANE
# routes (+ /health, /attestation). The enclave's sensitive routes (/provision,
# /sign/payload, /keys/derived, /oracle/fulfill, /feed/sign) are NOT exposed here —
# they stay reachable only from the host (relayer/feed-pusher) over the same vsock
# bridge, never from the public internet. Everything not explicitly allowed -> 404.
#
# EDGE FENCE (audit P2 fix): the comment above says "only Cloudflare-proxied
# traffic should reach the box", so enforce it at the edge instead of trusting
# the secrecy of the hostname. CF-Connecting-IP is stripped/overwritten per
# request so logs and any downstream limiter see the real client, and direct
# hits from non-Cloudflare sources are dropped. Keep the ranges in sync with
# https://www.cloudflare.com/ips/ (review quarterly).
#
# /health stays open to any source: uptime probes and the operator's SSH-side
# curl checks do not arrive through Cloudflare.

# Edge-fence classifier. geo is an HTTP-context directive, so it must live at
# file top level — this file is include()d from the http{} block as a
# conf.d drop-in, and inside server{} nginx would refuse to load it.
geo $cf_edge_traffic {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    127.0.0.1 1;
    ::1 1;
}

server {
    listen 80;
    listen 443 ssl;
    # Dedicated runtime hostname; only Cloudflare-proxied traffic should arrive here.
    server_name runtime.meshmini.app;

    ssl_certificate     /etc/morpheus/tls/runtime.meshmini.app.crt;
    ssl_certificate_key /etc/morpheus/tls/runtime.meshmini.app.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ---- Cloudflare edge fence ----
    # Real client IP as set by Cloudflare on the outermost hop.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # Anything NOT arriving from a Cloudflare edge (or the local socat bridge)
    # cannot reach the proxied execution routes — the $cf_edge_traffic
    # classifier is defined at http level (file top). /health is exempt below.

    # Hard request-size cap (the enclave also caps at ENCLAVE_MAX_BODY_BYTES).
    client_max_body_size 256k;

    # Liveness + attestation (open; the attestation is a signed measurement).
    location = /health        { proxy_pass http://127.0.0.1:8787/health; }
    location ~ ^/(mainnet|testnet)/health$      { proxy_pass http://127.0.0.1:8787; }
    location ~ ^/(mainnet|testnet)/attestation$ { proxy_pass http://127.0.0.1:8787; }

    # The control plane's confidential EXECUTION_PLANE_ROUTES, network-prefixed.
    # Keep this regex IN SYNC with EXECUTION_PLANE_PASSTHROUGH in enclave-server.mjs
    # and EXECUTION_PLANE_ROUTES in the control plane.
    location ~ ^/(mainnet|testnet)/(oracle/query|oracle/smart-fetch|oracle/decrypt|oracle/message-reveal|compute/execute|neodid/(bind|action-ticket|recovery-ticket))$ {
        # Only Cloudflare edges (and the local bridge) may reach execution routes.
        if ($cf_edge_traffic = 0) { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Nitro-Token $http_x_nitro_token;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:8787;
    }

    # Everything else is refused — do NOT widen this without review.
    location / { return 404; }
}
