services:
  mainnet-request-worker:
    image: ${MORPHEUS_NITRO_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      # Fail-closed: activates the child-process sandbox guard (permission-guard.js).
      NODE_ENV: production
      PORT: 8080
      NITRO_SHARED_SECRET: ${NITRO_SHARED_SECRET}
      NITRO_API_TOKEN: ${NITRO_API_TOKEN}
      NITRO_USE_DERIVED_KEYS: 'false'
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      MORPHEUS_UPSTASH_GUARDS_ENABLED: ${MORPHEUS_UPSTASH_GUARDS_ENABLED}
      MORPHEUS_UPSTASH_FAIL_CLOSED: ${MORPHEUS_UPSTASH_FAIL_CLOSED}
      MORPHEUS_FEED_PAIR_REGISTRY_JSON: ${MORPHEUS_FEED_PAIR_REGISTRY_JSON:-}
      MORPHEUS_ENABLE_UNTRUSTED_SCRIPTS: ${MORPHEUS_ENABLE_UNTRUSTED_SCRIPTS:-}
      MORPHEUS_RUNTIME_CONFIG_JSON: ${MAINNET_RUNTIME_CONFIG_JSON}
      MORPHEUS_NETWORK: mainnet
      # On-chain result verification needs only the verifier PUBLIC key; every
      # signing lane is custody-side (docs/SIGNER_SERVICE.md §5).
      MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY: ${MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY_MAINNET:-}
      MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY_MAINNET: ${MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY_MAINNET:-}
      # All worker Neo N3 signing (sign lane and tx-relay lane) is custody-only
      # (docs/SIGNER_SERVICE.md §5): the worker holds no signing key material and
      # signs through the custody signer service.
      SIGNER_SERVICE_URL: ${SIGNER_SERVICE_URL:-}
      SIGNER_SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:-}
      SIGNER_ROLE_WORKER_KEY_ID: ${SIGNER_ROLE_WORKER_KEY_ID:-}
      SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID: ${SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID:-}
      # The tx-relay lane signs oracle-contract invocations as the updater
      # account (the relayer's fulfillment identity).
      SIGNER_ROLE_UPDATER_KEY_ID: ${SIGNER_ROLE_UPDATER_KEY_ID:-}
    expose:
      - '8080'
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - morpheus-request-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  testnet-request-worker:
    image: ${MORPHEUS_NITRO_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      # Fail-closed: activates the child-process sandbox guard (permission-guard.js).
      NODE_ENV: production
      PORT: 8080
      NITRO_SHARED_SECRET: ${NITRO_SHARED_SECRET}
      NITRO_API_TOKEN: ${NITRO_API_TOKEN}
      NITRO_USE_DERIVED_KEYS: 'false'
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      MORPHEUS_UPSTASH_GUARDS_ENABLED: ${MORPHEUS_UPSTASH_GUARDS_ENABLED}
      MORPHEUS_UPSTASH_FAIL_CLOSED: ${MORPHEUS_UPSTASH_FAIL_CLOSED}
      MORPHEUS_FEED_PAIR_REGISTRY_JSON: ${MORPHEUS_FEED_PAIR_REGISTRY_JSON:-}
      MORPHEUS_ENABLE_UNTRUSTED_SCRIPTS: ${MORPHEUS_ENABLE_UNTRUSTED_SCRIPTS:-}
      MORPHEUS_RUNTIME_CONFIG_JSON: ${TESTNET_RUNTIME_CONFIG_JSON}
      MORPHEUS_NETWORK: testnet
      # On-chain result verification needs only the verifier PUBLIC key; every
      # signing lane is custody-side (docs/SIGNER_SERVICE.md §5).
      MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY: ${MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY_TESTNET:-}
      MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY_TESTNET: ${MORPHEUS_ORACLE_VERIFIER_PUBLIC_KEY_TESTNET:-}
      # All worker Neo N3 signing (sign lane and tx-relay lane) is custody-only
      # (docs/SIGNER_SERVICE.md §5): the worker holds no signing key material and
      # signs through the custody signer service.
      SIGNER_SERVICE_URL: ${SIGNER_SERVICE_URL:-}
      SIGNER_SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:-}
      SIGNER_ROLE_WORKER_KEY_ID: ${SIGNER_ROLE_WORKER_KEY_ID:-}
      SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID: ${SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID:-}
      # The tx-relay lane signs oracle-contract invocations as the updater
      # account (the relayer's fulfillment identity).
      SIGNER_ROLE_UPDATER_KEY_ID: ${SIGNER_ROLE_UPDATER_KEY_ID:-}
    expose:
      - '8080'
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - morpheus-request-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  request-router:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mainnet-request-worker:
        condition: service_healthy
      testnet-request-worker:
        condition: service_healthy
    ports:
      - '${MORPHEUS_PUBLIC_PORT:-3000}:8088'
    volumes:
      - /tmp/request-hub-caddy-data:/data
      - /tmp/request-hub-caddy-config:/config
    command:
      - /bin/sh
      - -lc
      - |
        cat >/etc/caddy/Caddyfile <<'EOF'
        {
          auto_https off
          admin off
        }

        :8088 {
          handle /testnet/* {
            reverse_proxy testnet-request-worker:8080 {
              header_up X-Morpheus-Network testnet
            }
          }

          handle /mainnet/* {
            reverse_proxy mainnet-request-worker:8080 {
              header_up X-Morpheus-Network mainnet
            }
          }

          handle {
            reverse_proxy testnet-request-worker:8080 {
              header_up X-Morpheus-Network testnet
            }
          }
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile

  mainnet-request-relayer:
    image: ${MORPHEUS_RELAYER_IMAGE}
    restart: unless-stopped
    depends_on:
      mainnet-request-worker:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_API_URL: http://mainnet-request-worker:8080
      NITRO_SHARED_SECRET: ${NITRO_SHARED_SECRET}
      NITRO_API_TOKEN: ${NITRO_API_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      MORPHEUS_RUNTIME_CONFIG_JSON: ${MAINNET_RUNTIME_CONFIG_JSON}
      MORPHEUS_HEARTBEAT_TIMEOUT_MS: ${MORPHEUS_HEARTBEAT_TIMEOUT_MS:-3000}
      MORPHEUS_BETTERSTACK_RELAYER_HEARTBEAT_URL: ${MORPHEUS_BETTERSTACK_RELAYER_HEARTBEAT_URL:-}
      MORPHEUS_BETTERSTACK_RELAYER_FEED_HEARTBEAT_URL: ${MORPHEUS_BETTERSTACK_RELAYER_FEED_HEARTBEAT_URL:-}
      MORPHEUS_BETTERSTACK_RELAYER_FAILURE_URL: ${MORPHEUS_BETTERSTACK_RELAYER_FAILURE_URL:-}
      # All relayer Neo N3 signing (fulfillment + result payload) is custody-only
      # (docs/SIGNER_SERVICE.md §5): no signing key material is provisioned here.
      SIGNER_SERVICE_URL: ${SIGNER_SERVICE_URL:-}
      SIGNER_SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:-}
      SIGNER_ROLE_UPDATER_KEY_ID: ${SIGNER_ROLE_UPDATER_KEY_ID:-}
      SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID: ${SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID:-}
      MORPHEUS_RELAYER_MODE: requests_only
      MORPHEUS_RELAYER_STATE_FILE: /data/.morpheus-relayer-state.requests_only.mainnet.json
      MORPHEUS_NETWORK: mainnet
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - morpheus-request-data:/data
    healthcheck:
      test: ['CMD', 'node', 'workers/morpheus-relayer/src/healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  testnet-request-relayer:
    image: ${MORPHEUS_RELAYER_IMAGE}
    restart: unless-stopped
    depends_on:
      testnet-request-worker:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_API_URL: http://testnet-request-worker:8080
      NITRO_SHARED_SECRET: ${NITRO_SHARED_SECRET}
      NITRO_API_TOKEN: ${NITRO_API_TOKEN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      MORPHEUS_RUNTIME_CONFIG_JSON: ${TESTNET_RUNTIME_CONFIG_JSON}
      MORPHEUS_HEARTBEAT_TIMEOUT_MS: ${MORPHEUS_HEARTBEAT_TIMEOUT_MS:-3000}
      MORPHEUS_BETTERSTACK_RELAYER_HEARTBEAT_URL: ${MORPHEUS_BETTERSTACK_RELAYER_HEARTBEAT_URL:-}
      MORPHEUS_BETTERSTACK_RELAYER_FEED_HEARTBEAT_URL: ${MORPHEUS_BETTERSTACK_RELAYER_FEED_HEARTBEAT_URL:-}
      MORPHEUS_BETTERSTACK_RELAYER_FAILURE_URL: ${MORPHEUS_BETTERSTACK_RELAYER_FAILURE_URL:-}
      # All relayer Neo N3 signing (fulfillment + result payload) is custody-only
      # (docs/SIGNER_SERVICE.md §5): no signing key material is provisioned here.
      SIGNER_SERVICE_URL: ${SIGNER_SERVICE_URL:-}
      SIGNER_SERVICE_TOKEN: ${SIGNER_SERVICE_TOKEN:-}
      SIGNER_ROLE_UPDATER_KEY_ID: ${SIGNER_ROLE_UPDATER_KEY_ID:-}
      SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID: ${SIGNER_ROLE_ORACLE_VERIFIER_KEY_ID:-}
      MORPHEUS_RELAYER_MODE: requests_only
      MORPHEUS_RELAYER_STATE_FILE: /data/.morpheus-relayer-state.requests_only.testnet.json
      MORPHEUS_NETWORK: testnet
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - morpheus-request-data:/data
    healthcheck:
      test: ['CMD', 'node', 'workers/morpheus-relayer/src/healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  morpheus-request-data:
