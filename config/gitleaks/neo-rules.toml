[extend]
useDefault = true

# Canonical Neo secret-material detection rules for the r3e-network gitleaks
# configs — this file is the single source of truth. Consumers keep a local
# copy of these two rules and their CI compares the rule block (the
# id/regex/tags/severity lines) against this file before scanning, so a
# change here turns every consumer's scan red until it is synced deliberately.
#
# Remote extends are deliberately not used: in 8.30.1 `[extend] url` fails
# silently (an unreachable or malformed fragment leaves the scan green with no
# Neo rules loaded — verified 2026-09-01 against a local HTTP server; the same
# silent no-op for file:// and http://), and `path` cannot be combined with
# `useDefault` in the same config (hard load error). So this fragment carries
# `useDefault` itself and neo-os-services references it via `[extend] path`,
# which gitleaks resolves relative to the process CWD — the CI workflows run
# from the repository root. Defaults still load through the chained extend.
#
# Why dedicated rules: `useDefault` alone does not cover a bare WIF: every
# generic gitleaks rule requires a keyword (`api_key`, `password`, `Bearer`,
# `aws`, `eyJ`) within a few characters of the match, and 52 characters of
# base58 supplies none — even `VERIFIER_WIF = 'Kx…'` only looks keyword-ish to
# a human. neo-os-web's deploy/scripts/audit_secret_material.mjs:15-27
# explains exactly this hole.

[[rules]]
id = "neo-wif-private-key"
description = "Neo private key in Wallet Import Format"
regex = '''(?:^|[^0-9A-Za-z])[KL][1-9A-HJ-NP-Za-km-z]{51}(?:[^0-9A-Za-z]|$)'''
tags = ["neo", "private-key", "wif"]
severity = "CRITICAL"

[[rules]]
id = "neo-nep2-private-key"
description = "NEP-2 encrypted Neo private key"
regex = '''(?:^|[^0-9A-Za-z])6P[1-9A-HJ-NP-Za-km-z]{56}(?:[^0-9A-Za-z]|$)'''
tags = ["neo", "private-key", "nep2"]
severity = "CRITICAL"
