[package]
name = "neo-os-games"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Game lane: 11 hash-pinned engines, registry, parity driver and generic confidential session protocol"

# Engines are content (hash-pinned and parity-golden-backed), while compute's
# oracle/policy lanes are protocol. Keeping the crate boundary real prevents
# unrelated provider churn from drowning engine drift signals.

[dependencies]
base64 = "0.22"
hmac = "0.12"
neo-os-core = { path = "../neo-os-core" }
num-bigint = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
