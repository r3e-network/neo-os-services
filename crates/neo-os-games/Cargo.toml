description = "Game lane: 11 hash-pinned engines, registry, parity driver and session host (T01 skeleton; bodies migrate out of neo-os-compute in T05)"

# T01 skeleton only — see docs/rust-migration/ARCHITECTURE.md §2.3 decision 1.
# The engine bodies, registry, parity driver and (T05) the session host move
# here from neo-os-compute/src/game. Rationale for the split: engines are
# "content" (hash-pinned, parity-golden-backed, reviewed per game) while the
# oracle lane is "protocol" (evolves with upstream providers). Mixing them
# drowns parity drift signals in unrelated churn. Zero dependencies until the
# split lands so the skeleton cannot drift from the real move.

