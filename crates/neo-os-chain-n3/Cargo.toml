[package]
name = "neo-os-chain-n3"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Neo N3 chain adapter: JSON-RPC client, script/tx assembly over neo-os-core, n3index cursors, SSRF-guarded transports (T01 skeleton)"

# T01 skeleton — bodies land in T03 (see docs/rust-migration/ARCHITECTURE.md §1.1).
# Scope, ported from workers/morpheus-relayer/src/neo-n3.js (1130 LOC):
# block-window scans, n3index request cursors, invokefunction/getapplicationlog
# reads, tx assembly/sign/broadcast (script assembly reuses neo-os-core::n3_tx,
# which is already vector-locked), feed record reads.
#
# Transport discipline: every HTTP call goes through an injected transport so
# `cargo test` never touches the network. RPC surface is only the five methods
# getblockcount / invokefunction / getapplicationlog / sendrawtransaction /
# getcontractstate — no heavyweight SDK. EVM counterpart is neo-os-chain-evm.

[dependencies]
