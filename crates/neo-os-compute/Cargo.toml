[package]
name = "neo-os-compute"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Keyless compute engine, ported lane-by-lane from workers/nitro-worker: platform guards, policy engine, capability routing; the enclave host links the lanes and shrinks the bridge table"

[dependencies]
neo-os-games = { path = "../neo-os-games" }
neo-os-core = { path = "../neo-os-core" }
# preserve_order: JSON.parse in V8 preserves key order and the policy/decision
# bodies copy that order into caller-facing JSON; the BTreeMap default would
# silently sort keys.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# BigInt for the oracle decimal lane (`BigInt(wholePart) * 10n ** decimals`)
# and the message-reveal BigInt grammar.
num-bigint = "0.5"
num-traits = "0.2"
sha2 = "0.10"
# Lenient `Buffer.from(x, 'base64')` decoding for Neo ByteString stack items.
base64 = "0.22"
# `new URL(...)` for the oracle fetch allowlist/normalize lane and the
# encrypted-ref claim URLs (oracle/fetch.js, crypto.js).
url = "2"
# The concrete egress transport behind oracle fetch / Neo RPC / encrypted-ref
# claim (`workers/nitro-worker` uses undici + global fetch; the pure lanes take
# an injected transport, this is the enclave-side implementation).
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "rustls-tls",
] }
# Oracle envelope crypto (crypto.js): X25519 ECDH + HKDF-SHA256 + AES-256-GCM
# for both the confidential-payload envelope and the sealed keystore. x25519
# goes through curve25519-dalek's MontgomeryPoint (x25519-dalek is just a thin
# wrapper and was not in the offline registry cache).
curve25519-dalek = "=4.1.3"
hkdf = "0.12"
# Game goldens' problemSecret derivation: HMAC-SHA256(key=[7u8;32], label) —
# workers/nitro-worker/src/game/goldens.mjs secretOf.
hmac = "0.12"
sha3 = "0.10"
aes-gcm = "0.10"
# EIP-191 personal-message recovery for the message-reveal lane.
k256 = { version = "0.13", features = ["ecdsa"] }
# crypto.rsa_verify — Node `createVerify('RSA-SHA256')` parity (PKCS#1 v1.5).
aws-lc-rs = "1.18"
# Ephemeral oracle key generation (dev fallback path).
rand = "0.8"
# stableStringify's ICU 'en' collation key sort (same deps as neo-os-core;
# compiled_data keeps the tables baked in for the offline enclave build).
icu_collator = { version = "2", features = ["compiled_data"] }
icu_locale_core = "2"
# Script lane sandbox (`src/platform/script-child.cjs` ran a hardened Node
# child with node:vm; the Rust port embeds boa_engine instead, killing the
# multi-process hop).
boa_engine = "0.21"
# Script policy blocked-pattern gate (`src/platform/script-policy.js`).
regex = "1"

[dev-dependencies]
