[package]
name = "neo-os-chain-evm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NeoX EVM chain adapter: RPC client, confidential-envelope decode, fulfillment and revert normalization (T01 skeleton)"

# T01 skeleton — bodies land in T03 (see docs/rust-migration/ARCHITECTURE.md §1.1).
# Scope, ported from workers/morpheus-relayer/src/neox.js (547 LOC): EVM scans,
# confidential envelope decoding, fulfillment digest binding, signing, receipt
# waiting, revert normalization.
#
# Digest parity is already vector-locked via crates/morpheus-core vectors
# (neox_digest.json); this crate composes on top of it.
#
# Dependency note: alloy (not ethers-rs) when the real client lands in T03 —
# pure Rust, no C builds, keeps the enclave `--locked` reproducible-build path
# clean (ARCHITECTURE.md risk R9).

