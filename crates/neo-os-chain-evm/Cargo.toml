[package]
name = "neo-os-chain-evm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NeoX EVM chain adapter: JSON-RPC, ABI, fulfillment verification, custody signing, and EIP-1559 transactions"

# T03 bodies ported from workers/morpheus-relayer/src/neox.js (547 LOC).
#
# Dependency decisions (ARCHITECTURE.md §3.2, risk R9):
# - No ethers-rs / no full alloy: the needed ABI shapes (uint256/address/bool/
#   bytes32/bytes/string + one 13-field tuple) are hand-encoded here and
#   vector-locked against ethers-harvested goldens (tests/vectors/neox_abi.json,
#   tests/vectors/neox_signing.json). This keeps the enclave build pure-Rust
#   and `--locked` reproducible.
# - keccak256 via `sha3` (already in the workspace lockfile via morpheus-compute).
# - The crate contains no private-key fallback. It derives and verifies the
#   exact EIP-191/EIP-1559 wire values while production signatures come only
#   from the authenticated custody service.

[dependencies]
neo-os-core = { path = "../neo-os-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha3 = "0.10"
url = "2"
rlp = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
hex = "0.4"
