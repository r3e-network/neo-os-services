# Redis Sentinel Configuration for NeoOS High Availability

# Monitor the master nodes
sentinel monitor neoos redis-master-0 6379 2

# Send alerts when a master is not reachable
sentinel down-after-milliseconds neoos 5000

# Convert slave to master if needed, requires 1 vote
sentinel failover-timeout neoos 10000

# Limit number of clients that can reconnect during failover
sentinel parallel-syncs neoos 1

# Enable sentinel authentication
# (matches your environment variable REDIS_PASSWORD)
sentinel auth-pass neoos ${REDIS_PASSWORD}

# Start sentinels on port 26379, 26380, 26381
port 26379

# Logging configuration
loglevel notice
