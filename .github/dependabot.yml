version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
  - package-ecosystem: 'nuget'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'deps'
      include: 'scope'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'ci'
      include: 'scope'
