name: deploy-web

concurrency:
  group: neoos-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runner:
    permissions: {}
    uses: ./.github/workflows/runner-policy.yml

  preflight:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          echo "HAS_VERCEL_TOKEN=$HAS_VERCEL_TOKEN"
          echo "HAS_VERCEL_ORG_ID=$HAS_VERCEL_ORG_ID"
          echo "HAS_VERCEL_PROJECT_ID=$HAS_VERCEL_PROJECT_ID"
          if [ "$HAS_VERCEL_TOKEN" = "true" ] && [ "$HAS_VERCEL_ORG_ID" = "true" ] && [ "$HAS_VERCEL_PROJECT_ID" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment skipped because required secrets are missing."
          fi

  # The release gate for the Vercel production deploy. `needs:` cannot reach a
  # job in ci.yml, so the suites that guard the web surface run here, on this
  # same commit, and `deploy` blocks on them. Mirrors ci.yml's lint-and-format
  # plus the shared/web-test/web-build slices of its web-and-worker matrix.
  # No timeout-minutes, matching ci.yml: a tighter budget here would be a way
  # for the gate to fail that CI itself cannot reproduce.
  test:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: node --test scripts/release-gating.test.mjs
      - run: node scripts/check-web-consistency.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm --prefix packages/shared test
      - run: npm --prefix apps/web run test:run
      # Same as ci.yml's web-build: networks.ts refuses to build without an
      # explicit network, and each network is its own build.
      - run: |
          for network in testnet mainnet; do
            echo "::group::apps/web build for $network"
            MORPHEUS_NETWORK="$network" npm --prefix apps/web run build
            echo "::endgroup::"
          done

  deploy:
    needs: [runner, preflight, test]
    if: ${{ needs.preflight.outputs.ready == 'true' && needs.runner.outputs.on_default_branch == 'true' }}
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm install --global vercel@57.0.0
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Verify Vercel production runtime environment
        run: npm run check:web-production-env
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
