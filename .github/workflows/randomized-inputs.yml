name: Randomized services inputs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  randomized-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build randomized Rust test
        run: cargo test --locked -p neo-os-compute --test randomized_inputs --no-run --message-format=json > "$RUNNER_TEMP/randomized-build.json"
      - name: Exercise randomized inputs within 55 seconds
        timeout-minutes: 1
        run: node fuzz-testing/run-services-inputs.mjs "$RUNNER_TEMP/randomized-build.json"
