name: Select runner

on:
  workflow_call:
    outputs:
      runner:
        description: Runner selected from the caller's repository and event
        value: ${{ jobs.select.outputs.runner }}
      on_default_branch:
        description: Exact nonempty default-branch ref match for release admission
        value: ${{ jobs.select.outputs.on_default_branch }}

permissions: {}

jobs:
  select:
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      on_default_branch: ${{ steps.select.outputs.on_default_branch }}
    steps:
      - id: select
        name: Compare trusted event values exactly
        shell: python
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          import os

          private = os.environ['REPOSITORY_PRIVATE'] == 'true'
          event = os.environ['EVENT_NAME']
          branch = os.environ['DEFAULT_BRANCH']
          ref = os.environ['EVENT_REF']
          on_default_branch = bool(branch) and ref == 'refs/heads/' + branch
          default_dispatch = event == 'workflow_dispatch' and on_default_branch
          default_push = event == 'push' and on_default_branch
          eligible = private and (default_dispatch or default_push)
          runner = 'neoos-isolated-linux' if eligible else 'ubuntu-latest'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('runner=' + runner + '\n')
              output.write('on_default_branch=' + ('true' if on_default_branch else 'false') + '\n')
