name: Environment Variable Validation

concurrency:
  group: neoos-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # Run on every push to main branches
  push:
    branches: [main, develop]
  # Allow manual triggers
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network (testnet/mainnet)'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
  # Run on PRs to allow pre-deployment validation
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  runner:
    permissions: {}
    uses: ./.github/workflows/runner-policy.yml

  validate-network-env:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    name: Validate Network Configuration

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Morpheus Network Configuration
        id: network-check
        env:
          NETWORK: ${{ github.event.inputs.network }}
        run: |
          echo "🔍 Validating MORPHEUS_NETWORK configuration..."

          # Get network from input or skip explicit check
          if [[ -z "$NETWORK" ]]; then
            echo "⚠️ No explicit network specified, skipping targeted validation"
            exit 0
          fi

          echo "📋 Targeting: $NETWORK"

          # Verify scripts can load without errors
          if [[ ! -f "scripts/check-root-env.mjs" ]]; then
            echo "❌ ERROR: check-root-env.mjs script not found"
            exit 1
          fi

          # Run the actual environment check for the chosen network. The
          # script reads the process environment over any .env file, so the
          # network and any deployment variables given to this job count.
          MORPHEUS_NETWORK="$NETWORK" npm run check:env || {
            echo "❌ Environment validation failed"
            exit 1
          }

          echo "✅ Network validation passed"

      # Behaviour, not source text: the test fails if networks.ts stops failing
      # closed on a missing or misspelt network (a grep for the message passed
      # as long as the string existed anywhere in the file).
      - name: networks.ts fails closed without an explicit network
        run: npm --prefix apps/web run test:run -- __tests__/networks.test.ts

      # check:env must honour the dispatched network and the job environment,
      # not only .env files: a runner has no .env.
      - name: check:env reads the process environment
        run: node --test scripts/check-root-env.test.mjs

  validate-web-app-env:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    name: Validate Web App Environment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install web app dependencies
        run: cd apps/web && npm ci --ignore-scripts

      # Advisory: CI holds no deployment secrets, so --fail-on-missing always
      # reports missing variables here. The output lists what a deployment
      # must provide; it is not a pass/fail gate and does not claim one.
      - name: Report web cron environment (advisory)
        run: |
          npm run check:web-cron-env -- --fail-on-missing || \
            echo "::notice::check:web-cron-env reported missing variables (expected without deployment secrets)"

  validate-signers:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    name: Validate Signer Configuration

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Advisory for the same reason: no signer configuration exists in CI.
      - name: Report signer configuration (advisory)
        run: |
          npm run check:signers || \
            echo "::notice::check:signers could not validate signers (expected without deployment configuration)"

  summary:
    needs: [runner, validate-network-env, validate-web-app-env, validate-signers]
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    if: always()

    steps:
      - name: Job Status Summary
        run: |
          echo "=========================================="
          echo "Environment Validation Summary"
          echo "=========================================="

          if [[ "${{ needs.validate-network-env.result }}" == "success" ]] && \
             [[ "${{ needs.validate-web-app-env.result }}" == "success" || "${{ needs.validate-web-app-env.result }}" == "skipped" ]] && \
             [[ "${{ needs.validate-signers.result }}" == "success" || "${{ needs.validate-signers.result }}" == "skipped" ]]; then
            echo "All environment validation jobs succeeded (the web cron and signer reports are advisory)."
          else
            echo "❌ Environment validation FAILED or had issues"
            echo "Please review the failures above before deploying."
            exit 1
          fi
