name: publish-images

concurrency:
  group: neoos-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'crates/**'
      - 'workers/neo-signer/**'
      - 'workers/nitro-enclave-host/**'
      - 'workers/neo-os-relayer/**'
      - 'deploy/nitro/Dockerfile.enclave'
      - 'deploy/nitro/Dockerfile.signer'
      - 'deploy/nitro/Dockerfile.relayer'
      - 'deploy/systemd/**'
      - 'scripts/check-rust-production-topology.mjs'
      - 'scripts/check-rust-production-topology.test.mjs'
      - 'scripts/release-gating.test.mjs'
      - '.github/workflows/publish-images.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  # These are the exact Rust packages baked below. Compatibility Node worker
  # suites remain in CI, but cannot authorize a Rust production artifact.
  test:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - run: npm ci
      - run: node --test scripts/release-gating.test.mjs scripts/check-rust-production-topology.test.mjs
      - run: npm run check:production-topology
      - run: node scripts/check-rust-format.mjs
      - run: cargo clippy --locked --all-targets -p neo-signer -p nitro-enclave-host -p neo-os-relayer -- -D warnings
      - run: cargo test --locked --all-targets -p neo-signer -p nitro-enclave-host -p neo-os-relayer

  build-and-push:
    needs: [test]
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nitro-host
            dockerfile: deploy/nitro/Dockerfile.enclave
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-nitro-host
          - name: signer
            dockerfile: deploy/nitro/Dockerfile.signer
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-signer
          - name: relayer
            dockerfile: deploy/nitro/Dockerfile.relayer
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-relayer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          # Immutable commit tags only. Operators pin the exact image used to
          # build/re-measure an EIF; neither branch names nor `latest` can move.
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
