name: publish-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/nitro-worker/**'
      - 'workers/morpheus-relayer/**'
      - 'packages/shared/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/publish-images.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  # The release gate for the ghcr images. `needs:` cannot reach a job in ci.yml,
  # so the suites covering the two workers that get baked into these images run
  # here, on this same commit, and `build-and-push` blocks on them. Without this
  # a push to main tags `:latest` regardless of whether ci.yml passed.
  # This job deliberately does not hold `packages: write`.
  # No timeout-minutes, matching ci.yml: a tighter budget here would be a way
  # for the gate to fail that CI itself cannot reproduce.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --test scripts/release-gating.test.mjs
      - run: npm --prefix packages/shared test
      - run: npm --prefix workers/nitro-worker test
      - run: npm --prefix workers/morpheus-relayer test

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nitro-worker
            dockerfile: workers/nitro-worker/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-nitro-worker
            legacy_image: ghcr.io/${{ github.repository_owner }}/neo-morpheus-oracle-nitro-worker
          - name: morpheus-relayer
            dockerfile: workers/morpheus-relayer/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-relayer
            legacy_image: ghcr.io/${{ github.repository_owner }}/neo-morpheus-oracle-relayer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: |
            ${{ matrix.image }}
            ${{ matrix.legacy_image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
