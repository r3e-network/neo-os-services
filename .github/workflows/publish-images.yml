name: publish-images

concurrency:
  group: neoos-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'crates/**'
      - 'workers/neo-signer/**'
      - 'workers/nitro-enclave-host/**'
      - 'workers/neo-os-relayer/**'
      - 'deploy/nitro/Dockerfile.enclave'
      - 'deploy/nitro/Dockerfile.signer'
      - 'deploy/nitro/Dockerfile.relayer'
      - 'deploy/systemd/**'
      - 'scripts/check-rust-production-topology.mjs'
      - 'scripts/check-rust-production-topology.test.mjs'
      - 'scripts/release-gating.test.mjs'
      - '.github/workflows/publish-images.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  runner:
    permissions: {}
    uses: ./.github/workflows/runner-policy.yml

  # Keep all three Rust service gates, including custody. Generic publication
  # excludes signer: its dedicated measured build requires a reviewed vault profile.
  # Compatibility Node suites cannot authorize these Rust artifacts.
  test:
    needs: runner
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - run: npm ci
      - run: node --test scripts/release-gating.test.mjs scripts/check-rust-production-topology.test.mjs
      - run: npm run check:production-topology
      - run: node scripts/check-rust-format.mjs
      - run: cargo clippy --locked --all-targets -p neo-signer -p nitro-enclave-host -p neo-os-relayer -- -D warnings
      - run: cargo test --locked --all-targets -p neo-signer -p nitro-enclave-host -p neo-os-relayer

  build-and-push:
    needs: [runner, test]
    runs-on: ${{ needs.runner.outputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nitro-host
            dockerfile: deploy/nitro/Dockerfile.enclave
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-nitro-host
          - name: relayer
            dockerfile: deploy/nitro/Dockerfile.relayer
            image: ghcr.io/${{ github.repository_owner }}/neo-os-services-relayer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          # Immutable commit tags only. Operators pin the exact image used to
          # build/re-measure an EIF; neither branch names nor `latest` can move.
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
