name: measured-candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed canonical source commit (40 lowercase hex)
        required: true
        type: string
      public_bundle_sha256:
        description: Independently reviewed SHA256 of the decoded public bundle
        required: true
        type: string
      public_bundle_base64:
        description: Bounded public JSON bundle; no credentials or private files
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: measured-candidate
  cancel-in-progress: false

jobs:
  measured-candidate:
    if: github.repository == 'r3e-network/neo-os-services' && toJSON(github.event.repository.private) == 'false' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and verify measured candidate
        id: candidate
        env:
          CANDIDATE_SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLIC_BUNDLE_SHA256: ${{ inputs.public_bundle_sha256 }}
          PUBLIC_BUNDLE_BASE64: ${{ inputs.public_bundle_base64 }}
          CANDIDATE_REPOSITORY_PRIVATE: ${{ toJSON(github.event.repository.private) }}
        run: python3 -B scripts/hosted_native_candidate.py
      - name: Upload verified measured candidate
        if: success() && steps.candidate.outputs.verified == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measured-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.candidate.outputs.path }}/enclave.eif
            ${{ steps.candidate.outputs.path }}/build-evidence.json
            ${{ steps.candidate.outputs.path }}/hosted-evidence.json
            ${{ steps.candidate.outputs.path }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
