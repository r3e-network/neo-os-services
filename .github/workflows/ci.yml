name: ci

concurrency:
  group: neoos-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Detect which areas changed so the heavy downstream jobs can skip on docs-only PRs.
  # Always reports 'yes' on main pushes (full coverage is preserved there) and on PRs that
  # touch workflow/config code (a ci.yml change could affect any job). Round-2 R2-4.1.
  changes:
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
      evm: ${{ steps.filter.outputs.evm }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'workers/**'
              - 'crates/**'
              - 'packages/**'
              - 'contracts/**'
              - 'contracts-evm/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'vendor/**'
              - 'vendor/neo-os-did.pin.json'
              - 'config/**'
              # Migrations and the SQL acceptance suite: the rust job applies
              # them on PostgreSQL and the morpheus-relayer suite reads them.
              - 'db/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
            evm:
              - 'contracts-evm/**'
              - '.github/workflows/**'

  lint-and-format:
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Exercise gate regressions before any repository gate can stop the job.
      - run: npm run test:scripts
      - run: node --test packages/shared/src/public-runtime.test.mjs
      # A dependency bump changes package-lock.json, which is a reviewed input of
      # baselines/vrf-consumers.json, so the bump invalidates that binding. The VRF gate
      # refuses that, but it is step 23 of this job and the audit at step 7 is red for
      # advisories it did not introduce, so the bump's own run never reaches it — which is
      # how the same stale lockfile binding landed three times in one week and was each
      # time cleared by a later, unrelated branch. This reports every stale binding here,
      # above the audit and above the drift guard that rewrites package-lock.json in place,
      # and on a pull request it says which ones this change caused.
      - name: Policy bindings are fresh in the change that touches them
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            node scripts/check-policy-binding-freshness.mjs --base "$BASE_SHA"
          else
            node scripts/check-policy-binding-freshness.mjs
          fi
      # Blocking, and scoped: production dependencies may carry no advisory at or above
      # moderate, and every dev-only advisory needs a dated, owner-assigned entry in
      # config/npm-audit-exceptions.json (today GHSA-vfj7-8cjw-p6xm: braces behind
      # eslint-config-next, no upstream fix). This replaces a blanket audit that failed on
      # that advisory and so kept every later step of this job from running. The gate fails
      # closed when npm cannot produce an audit report.
      - run: npm run check:npm-audit
      - run: node --test scripts/check-npm-audit.test.mjs
      - run: npm run check:tracked-build-outputs
      - name: Guard against package-lock drift
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json
      # The audit and drift guard above cover every workspace, apps/web
      # included: all of them install from the root lock. This pins the
      # patched versions of the apps/web closure and keeps that lock the only
      # one (the NeoSwap job that used to audit a separate apps/web lock was
      # deleted with services/neoswap).
      - run: node --test scripts/dependency-security.test.mjs
      - run: node scripts/export-public-runtime-catalog.mjs --output /tmp/morpheus-runtime-catalog.json >/dev/null
      - run: cmp -s /tmp/morpheus-runtime-catalog.json apps/web/public/morpheus-runtime-catalog.json
      - run: node scripts/check-web-consistency.mjs
      # Unconditional (lint-and-format has no path filter), so a pull request
      # that moves db/services/migrations is caught even when the path-filtered
      # rust and web-and-worker jobs would not run.
      - run: node --test scripts/db-migration-paths.test.mjs
      - run: npm run format:check
      - run: npm run lint
      # ESLint does not resolve imports. This parses (never runs) every tracked
      # ES module and fails on a relative import of a missing file or of a name
      # the target does not export.
      - run: node --test scripts/module-imports.test.mjs
      # Representative secret and build-output paths stay ignored anywhere in
      # the tree, and no tracked source is hidden by an ignore rule.
      - run: node --test scripts/gitignore-protections.test.mjs
      - run: npm run check:rust-migration
      - run: npm run check:production-topology
      # Declared capability ids, the host route table and the web proxies must agree, or
      # carry a dated, owned entry in baselines/capability-route-parity.json.
      - run: npm run check:capability-route-parity
      - run: node scripts/check-vrf-consumers.mjs
      # The baseline only shrinks. In the tree it cannot tell an entry that was always there
      # from one added in the same change as the dead lane it excuses, so on a pull request
      # it is compared with the base commit: no entry added, none dated later, no proxy
      # re-pointed. The job has no path filter, so a baseline-only edit is checked too.
      - name: Capability route-parity baseline only shrinks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          npm run check:capability-route-parity -- --base "$BASE_SHA"
          node scripts/check-vrf-consumers.mjs --base "$BASE_SHA"
      - run: npm run check:cargo-lock-provenance
      - name: Audit Rust dependencies with reviewed exceptions
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          npm run check:rust:audit
      - run: node --test scripts/rust-security-audit-policy.test.mjs
      # Cargo.lock floors for the rustls and protobuf advisories. Runs here, not
      # in the path-filtered jobs, so a Cargo.lock-only change is still checked.
      - run: node --test scripts/rust-security-dependency.test.mjs
      - run: npm run check:neodid-vendor
      - name: Verify checked-in network identity projections
        run: |
          node scripts/export-network-identities.mjs --check-local
          node --test scripts/network-identity-projections.test.mjs
          node --test scripts/lib-network-registry.test.mjs scripts/render-nitro-env.test.mjs scripts/render-nitro-compose-env.test.mjs
          node --test scripts/network-identity-consumers.test.mjs
      # Asserts that deploy-web.yml and publish-images.yml still block on a test
      # job. Runs here as well as inside those workflows so a workflow edit is
      # caught on the pull request, not at the moment it deploys.
      - run: node --test scripts/release-gating.test.mjs
      # The golden vectors under crates/neo-os-core/tests/vectors/ are exported
      # from the JS implementations; this catches a JS edit that drifted the
      # oracle without regenerating them (the Rust ports verify against these).
      - run: node scripts/export-rust-vectors.mjs --check

  # The Rust crates of the repository-root cargo workspace (the custody service
  # and the consensus core). fmt/clippy/test all run --locked: a Cargo.lock
  # drift is a review finding, not a side effect (same posture as the npm
  # lockfile guard in lint-and-format).
  rust:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      # This job builds and tests the whole workspace and then builds neo-nexus
      # for the cross-repository signer contract; together they exhausted the
      # runner's disk ("No space left on device" compiling neo-nexus, 47 MB
      # free). Drop preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-rust-format.mjs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - name: Install private-chain test binary
        run: |
          GOBIN="$RUNNER_TEMP/local-chain-bin" go install -ldflags="-X github.com/nspcc-dev/neo-go/pkg/config.Version=0.121.0" github.com/nspcc-dev/neo-go/cli@v0.121.0
          mv "$RUNNER_TEMP/local-chain-bin/cli" "$RUNNER_TEMP/local-chain-bin/neo-go"
          echo "$RUNNER_TEMP/local-chain-bin" >> "$GITHUB_PATH"
      - name: Local-chain relayer scan and delivery acceptance
        run: python3 scripts/test-relayer-local-chain.py
      - name: Install PostgreSQL for delivery acceptance
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          for candidate in /usr/lib/postgresql/*/bin; do
            if test -x "$candidate/initdb"; then echo "$candidate" >> "$GITHUB_PATH"; fi
          done
      - name: Durable delivery PostgreSQL commit and lease acceptance
        run: bash scripts/test-relayer-delivery-v2.sh
      - name: Guard against Cargo.lock drift
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Checkout NeoNexus contract consumer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: r3e-network/neo-nexus
          path: neo-nexus-contract
          persist-credentials: false
      - name: Cross-repository signer contract
        env:
          NEO_NEXUS_DIR: ${{ github.workspace }}/neo-nexus-contract
        run: bash scripts/run-neo-nexus-signer-contract.sh

  # Run the 7 independent Node/web suites concurrently instead of sequentially. Each suite is
  # hermetic (no shared writable state — verified: they are isolated node --test / vitest /
  # next suites with per-test fixtures, not a shared DB). Wall-clock becomes ~max(suite)
  # instead of the sum. (Round-2 R2-4.3.)
  web-and-worker:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        suite:
          - shared
          - nitro-worker
          - morpheus-relayer
          - ops
          - control-plane
          - web-test
          - web-build
    name: web-and-worker (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix packages/shared test
        if: matrix.suite == 'shared'
      - run: npm --prefix workers/nitro-worker test
        if: matrix.suite == 'nitro-worker'
      - run: npm --prefix workers/morpheus-relayer test
        if: matrix.suite == 'morpheus-relayer'
      # deploy/nitro/enclave-host.test.mjs builds enclave_host with
      # `cargo build --offline` so the test itself never touches the network. A
      # fresh runner has no registry cache, so fetch the locked crates first;
      # without this the build hook fails and takes every enclave-host test with it.
      - run: cargo fetch --locked
        if: matrix.suite == 'ops'
      - run: npm run test:ops
        if: matrix.suite == 'ops'
      - run: npm run test:cloudflare
        if: matrix.suite == 'control-plane'
      - run: npm --prefix apps/web run test:run
        if: matrix.suite == 'web-test'
      # apps/web/lib/networks.ts refuses to build without an explicit network,
      # and NEXT_PUBLIC_ values are inlined at build time, so each network is
      # its own build.
      - run: |
          for network in testnet mainnet; do
            echo "::group::apps/web build for $network"
            MORPHEUS_NETWORK="$network" npm --prefix apps/web run build
            echo "::endgroup::"
          done
        if: matrix.suite == 'web-build'

  # The custody authority has an independent lockfile and package boundary.
  # Run its verifier-side request-proof tests explicitly so changes there are
  # covered even though the root scripts suite cannot install this package.
  custody-state-authority:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: deploy/custody-state-authority/package-lock.json
      - run: npm --prefix deploy/custody-state-authority ci
      - run: npm --prefix deploy/custody-state-authority test

  # The enclave measurement set used to be hand-maintained: nothing built an
  # EIF, re-derived its PCRs, or compared them to deploy/nitro/measurements/,
  # and nothing validated a manifest against manifest.schema.json (two
  # committed manifests carried a Rust Debug string where the schema requires
  # the SHA384 constant, and a third carried an undeclared property — all three
  # went unnoticed for three months). This job cannot build an EIF: a plain
  # GitHub runner has no nitro-cli and no Nitro hypervisor. What it can do is
  # refuse a tree whose committed measurements have stopped describing it.
  measurements:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # The build-input rule below diffs against the merge base, and the
          # reachability rule resolves a manifest's git_commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Schema validity, filename/release agreement, no all-zero PCR, the
      # manifest <-> KMS key policy ImageSha384 binding, the dated record of
      # every enclave that has not published one yet, and CL-29's refusal of a
      # debug-mode or console-attached launch anywhere under deploy/ or scripts/.
      - run: npm run check:nitro-measurements
      # The same rules again, plus: a change to Dockerfile.enclave,
      # Dockerfile.signer, Cargo.lock or vendor/** must arrive with a new
      # manifest whose git_commit is reachable. Only meaningful on a pull
      # request, where a merge base exists.
      - name: Measured build inputs changed without a new manifest
        if: github.event_name == 'pull_request'
        run: node scripts/check-nitro-measurements.mjs --base ${{ github.event.pull_request.base.sha }}
      - run: node --test scripts/check-nitro-measurements.test.mjs scripts/check-nitro-prereqs.test.mjs

  contracts:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      # Cache the NuGet package store + the Neo nccs global tool. Keyed on the nccs version pin
      # + a hash of all csproj files, so a dependency or contract change invalidates correctly.
      # Saves the nccs download + full NuGet restore on every contracts run (Round-2 R2-4.2).
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('contracts/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Cache Neo nccs tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-nccs-3.9.1
      # Install nccs idempotently: a cache hit leaves it already installed, so tolerate that
      # specific failure (a genuine install error still aborts — 'already installed' is the
      # only non-zero exit we expect when ~/.dotnet/tools is warm).
      - run: |
          dotnet tool install --global Neo.Compiler.CSharp --version 3.9.1 \
            || dotnet tool list --global | grep -q 'Neo.Compiler.CSharp.*3.9.1'
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: bash contracts/build.sh
      - run: node --test scripts/contract-build-regressions.test.mjs
      - run: dotnet test contracts/__tests__/NeoContracts.Tests.csproj

  host-private-chain:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Install acceptance dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          dotnet tool install --tool-path "$RUNNER_TEMP/host-chain-bin" Neo.Compiler.CSharp --version 3.9.1
          dotnet tool install --tool-path "$RUNNER_TEMP/host-chain-bin" Neo.Express --version 3.10.1
          echo "$RUNNER_TEMP/host-chain-bin" >> "$GITHUB_PATH"
          cargo fetch --locked
      - name: Build private-chain kernel
        run: |
          source scripts/dotnet_env.sh
          mkdir -p contracts/build
          nccs contracts/MorpheusOracle/MorpheusOracle.csproj --generate-artifacts Source --output contracts/build
      - name: Fulfill fresh kernel request through the host
        run: python3 scripts/test-host-private-chain.py

  # One request through the whole trust path on a disposable private chain:
  # the kernel queues it, the Rust relayer discovers and delivers it, the Rust
  # host fulfils it, the real custody service signs the digest, and the kernel
  # verifies that signature and stores the result. Composes the local-chain
  # seam and the host acceptance above, which each stand in for the other legs.
  e2e-private-chain:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: Install acceptance dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          dotnet tool install --tool-path "$RUNNER_TEMP/e2e-chain-bin" Neo.Compiler.CSharp --version 3.9.1
          dotnet tool install --tool-path "$RUNNER_TEMP/e2e-chain-bin" Neo.Express --version 3.10.1
          echo "$RUNNER_TEMP/e2e-chain-bin" >> "$GITHUB_PATH"
          cargo fetch --locked
      - name: Kernel, relayer, host and custody on a private chain
        run: |
          source scripts/dotnet_env.sh
          node scripts/test-e2e-private-chain.mjs

  # Foundry suite for the EVM (Neo X) mirror contracts. Gated on contracts-evm/** changes via
  # the 'evm' paths-filter output. solc 0.8.35 / evm_version paris are pinned in
  # contracts-evm/foundry.toml, and the harness is offline (local Vm interface in
  # test/TestBase.sol, libs = []), so no forge-std submodule fetch is required.
  contracts-evm:
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.evm == 'true' }}
    runs-on: ${{ github.event.repository.private == true && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && 'neoos-isolated-linux' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1
      - name: forge build
        run: forge build
        working-directory: contracts-evm
      - name: forge test
        run: forge test
        working-directory: contracts-evm
